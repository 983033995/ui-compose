name: Build Eval Fixtures

on:
  push:
    paths:
      - 'evals/harness/apps/**'
      - '.github/workflows/build-eval-fixtures.yml'
  pull_request:
    paths:
      - 'evals/harness/apps/**'
      - '.github/workflows/build-eval-fixtures.yml'

permissions:
  contents: write

jobs:
  vue-element-plus-orders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals/harness/apps/vue-element-plus-orders-baseline

    steps:
      - name: Checkout fixture branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Check fixture contract
        run: pnpm test

      - name: Build fixture
        run: pnpm build

      - name: Commit generated lockfile once
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock eval 01 fixture dependencies"
          git push origin "HEAD:${TARGET_BRANCH}"
