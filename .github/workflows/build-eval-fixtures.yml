name: Build Eval Fixtures

on:
  workflow_dispatch:
    inputs:
      eval02_run_id:
        description: Stable Eval 02 evidence id (for example model-only-2026-09-01-a)
        required: true
        default: agent-chat-baseline
        type: string
      eval02_mode:
        description: Eval 02 capture mode
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - model-only
          - ui-compose
  push:
    paths:
      - 'evals/harness/apps/**'
      - '.github/workflows/build-eval-fixtures.yml'
  pull_request:
    paths:
      - 'evals/harness/apps/**'
      - '.github/workflows/build-eval-fixtures.yml'

jobs:
  vue-element-plus-orders:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals/harness/apps/vue-element-plus-orders-baseline

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check fixture contract
        run: pnpm test
      - name: Build fixture
        run: pnpm build

  agent-chat:
    runs-on: ubuntu-latest
    env:
      EVAL_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.eval02_run_id || 'agent-chat-baseline' }}
      EVAL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.eval02_mode || 'baseline' }}
      EVAL_SOURCE_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: evals/harness/apps/agent-chat-baseline

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check fixture contract
        run: pnpm test
      - name: Build fixture
        run: pnpm build
      - name: Install capture browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start fixture server
        run: |
          node scripts/serve.mjs > /tmp/agent-chat-server.log 2>&1 &
          echo $! > /tmp/agent-chat-server.pid
      - name: Capture rendered Eval 02 evidence
        run: node scripts/capture.mjs
      - name: Upload Agent Chat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-02-${{ env.EVAL_RUN_ID }}
          path: evals/harness/artifacts/eval-02/${{ env.EVAL_RUN_ID }}
          if-no-files-found: error
