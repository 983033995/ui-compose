name: Validate UI Compose

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  registries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate registries
        run: python scripts/validate_registries.py
