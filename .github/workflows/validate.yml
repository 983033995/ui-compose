name: Validate UI Compose

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate Agent Skill contract
        run: python scripts/validate_skill.py . --expected-install-name ui-compose

      - name: Validate internal links and references
        run: python scripts/validate_links.py .

      - name: Validate registries
        run: python scripts/validate_registries.py

      - name: Validate eval results
        run: python scripts/validate_evals.py
